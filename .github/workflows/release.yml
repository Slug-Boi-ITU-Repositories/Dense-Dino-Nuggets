name: Test and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test: 
    runs-on: ubuntu-latest
    steps:
      - name: Setup environment
        uses: actions/checkout@v4
      - name: Test
        uses: dagger/dagger-for-github@v8.3.0
        with:
          module: .
          args: test --src=.    
  # Add concurency here?
  build:
    needs: test
    if: success() 
    runs-on: ubuntu-latest
    steps:
      - name: Setup environment
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v6.2.0
        with:
          go-version: '1.25'
      - name: Build binaries
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "latest"
          verb: call
          module: .
          args: build --src=. export --path=./tmp 
      - name: Zip project
        run: |
          "for dir in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64; do
            tar -zcvf "${dir}.tar.gz" -C tmp/build "$dir"
          done"
      - name: Auto Changelog
        uses: ardalanamini/auto-changelog@v4.0.1
        id  : changelog
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-types: |
              feat: New Features
              fix: Bug Fixes
              build: Build System & Dependencies
              perf: Performance Improvements
              docs: Documentation
              test: Tests
              refactor: Refactors
              chore: Chores
              ci: CI
              cd: CD
              ci/cd: CI/CD
              style: Code Style
              revert: Reverts
      - name: Create release
        uses: softprops/action-gh-release@v2.5.0
        with:
          body: ${{steps.changelog.outputs.changelog}}
          files: "*.tar.gz"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  publish:
    needs: test
    if: success() 
    name: publish
    runs-on: ubuntu-latest
    steps:
      - name: Setup environment
        uses: actions/checkout@v4
      - name: Publish
        uses: dagger/dagger-for-github@v8.3.0
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          version: "latest"
          verb: call
          module: .
          args: publish --src=. --username=${{ secrets.DOCKER_USERNAME }} --password=DOCKER_PASSWORD
  provision:
    needs: publish
    if: success()
    name: provision
    runs-on: macos-latest # Turns out macos comes packaged with vagrant
    steps: 
      - name: Setup environment
        uses: actions/checkout@v4
      - name: Provision container
        env:
          CONTAINER_NAME_PREFIX: "prod"
          POSTGRES_DB: "minitwit_db"
          POSTGRES_HOST: "postgres"
          VOLUME_MOUNT: "/mnt/volume_fra1_01/pgdata"
          POSTGRES_PORT: "5432"
          DB_SSL_MODE: "disable"
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: vagrant provision minitwit


  

