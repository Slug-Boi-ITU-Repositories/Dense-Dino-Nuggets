name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main   

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run checks
        uses: dagger/dagger-for-github@v8.4.0
        with:
          check: "**"
          version: "latest"
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}