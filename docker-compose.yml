services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - target: ${POSTGRES_PORT}
        published: 5432
    networks:
      - minitwit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == minitwit
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 5s

  minitwit:
    image: ${DOCKER_USERNAME}/minitwitimage:latest
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: ingress
    networks:
      - minitwit-network
    logging:
      driver: loki
      options:
        loki-url: http://loki:3100/loki/api/v1/push  # Overlay network resolves service name
        loki-external-labels: service=minitwit,env=prod
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=${DB_SSL_MODE:-disable}
    depends_on:
      - postgres
    deploy:
      mode: replicated
      replicas: ${APP_REPLICAS}
      placement:
        constraints:
          - node.labels.role == app
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      resources:
        limits:
          cpus: '0.2'
          memory: 256M
        reservations:
          cpus: '0.2'
          memory: 128M

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - /root/prometheus_data/:/prometheus/data/
      - /root/prometheus/prometheus_prod.yml:/etc/prometheus/prometheus.yml
    ports:
      - target: 9090
        published: 9090
    networks:
      - minitwit-network
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    deploy:
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      placement:
        constraints:
          - node.labels.role == monitoring

  grafana:
    image: grafana/grafana
    environment:
      - PROMETHEUS_ADDRESS=prometheus
      - LOKI_ADDRESS=loki
    volumes:
      - /root/grafana_data:/var/lib/grafana/
      - /root/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - /root/grafana/dashboards/:/etc/grafana/provisioning/dashboards/
    ports:
      - target: 3000
        published: 3000
    networks:
      - minitwit-network
    deploy:
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      placement:
        constraints:
          - node.hostname == monitoring

  loki:
    image: grafana/loki:3.6.7
    ports:
      - target: 3100
        published: 3100
    volumes:
      - /root/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - minitwit-network
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      placement:
        constraints:
          - node.hostname == monitoring

volumes:
  postgres_data:
    driver: local
  loki_data:
    driver: local
  prometheus_data:
    driver: local

networks:
  minitwit-network:
    driver: overlay
    attachable: true
    name: minitwit-network