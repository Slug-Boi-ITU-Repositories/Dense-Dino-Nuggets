services:
  postgres:
    image: postgres:15-alpine
    container_name: ${CONTAINER_NAME_PREFIX:-minitwit}-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-minitwit_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minitwit_password}
      POSTGRES_DB: ${POSTGRES_DB:-minitwit_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - minitwit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-minitwit_user} -d ${POSTGRES_DB:-minitwit_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${POSTGRES_CPU_LIMIT:-0.5}'
          memory: ${POSTGRES_MEM_LIMIT:-512M}

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - '9090:9090'
    networks:
      - minitwit-network
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

minitwit:
    image: minitwit-monitoring:latest
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: ingress
    networks:
      - minitwit-network
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=${DB_SSL_MODE:-disable}
    depends_on:
      - postgres
    deploy:
      mode: replicated
      replicas: ${APP_REPLICAS:-3}
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      deploy:
        resources:
          limits:
            cpus: '0.5'
            memory: 512M
          reservations:
            cpus: '0.25'
            memory: 256M
      
networks:
  minitwit-network:
    external: false
    name: minitwit-network