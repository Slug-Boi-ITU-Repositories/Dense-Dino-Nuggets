services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - minitwit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      placement:
        constraints:
          - node.labels.role == app
      resources:
        limits:
          cpus: '${POSTGRES_CPU_LIMIT:-0.2}'
          memory: ${POSTGRES_MEM_LIMIT:-300M}

  minitwit:
    image: ${DOCKER_USERNAME}/minitwitimage:latest
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: ingress
    networks:
      - minitwit-network
    logging:
      driver: loki
      options:
        loki-url: http://loki-prod:3100/loki/api/v1/push  # Overlay network resolves service name
        loki-external-labels: service=minitwit,env=prod
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=${DB_SSL_MODE:-disable}
    depends_on:
      - postgres
    deploy:
      mode: replicated
      replicas: ${APP_REPLICAS}
      placement:
        constraints:
          - node.labels.role == app
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      resources:
        limits:
          cpus: '0.2'
          memory: 256M
        reservations:
          cpus: '0.2'
          memory: 128M

  prometheus-agent:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--enable-feature=agent"
    volumes:
      - ./prometheus/prometheus_agent.yml:/etc/prometheus/prometheus.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - minitwit-network
    deploy:
      mode: global
      placement:
        constraints:
          - node.labels.role == app
      resources:
        limits:
          cpus: '0.1'
          memory: 128M

  prometheus-prod:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus_data/:/prometheus/data/
      - ./prometheus/prometheus_prod.yml:/etc/prometheus/prometheus.yml
    ports:
      - '9090:9090'
    networks:
      - minitwit-network
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    deploy:
      placement:
        constraints:
          - node.labels.role == monitoring
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  grafana-prod:
    image: grafana/grafana
    environment:
      - PROMETHEUS_ADDRESS=prometheus-prod
      - LOKI_ADDRESS=loki-prod
    volumes:
      - ./grafana_data:/var/lib/grafana/
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./grafana/dashboards/:/etc/grafana/provisioning/dashboards/
    ports:
      - "3000:3000"
    networks:
      - minitwit-network
    deploy:
      placement:
        constraints:
          - node.labels.role == monitoring
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  loki-prod:
    image: grafana/loki:3.6.7
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - minitwit-network
    deploy:
      placement:
        constraints:
          - node.labels.role == monitoring
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

volumes:
  postgres_data:
    driver: local
  loki_data:
    driver: local
  prometheus_data:
    driver: local

networks:
  minitwit-network:
    driver: overlay
    attachable: true
    name: minitwit-network