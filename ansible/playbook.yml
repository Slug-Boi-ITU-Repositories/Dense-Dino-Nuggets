# Structure
# hosts
# vars (set up env vars)
# pre-tasks (check env vars are set and select docker image)
# tasks ()
# handlers (restarts nginx)

---
- name: Provision and deploy Minitwit application server
  hosts: test # Which machines to run on
  become: true # Run commands as sudo when true
  vars:
    docker_username: "{{ lookup('env', 'DOCKER_USERNAME') | default(lookup('env', 'USERNAME'), true) | default('flakiator', true) }}"

    # Database credentials
    container_name_prefix: "{{ lookup('env', 'CONTAINER_NAME_PREFIX') | default('minitwit') }}"
    postgres_user: "{{ lookup('env', 'POSTGRES_USER') }}"
    postgres_password: "{{ lookup('env', 'POSTGRES_PASSWORD') }}"
    postgres_db: "{{ lookup('env', 'POSTGRES_DB') }}"
    postgres_host: "{{ lookup('env', 'POSTGRES_HOST') | default('postgres') }}"
    postgres_port: "{{ lookup('env', 'POSTGRES_PORT') | default('5432') }}"
    db_ssl_mode: "{{ lookup('env', 'DB_SSL_MODE') | default('true') }}"
    volume_mount: "{{ lookup('env', 'VOLUME_MOUNT') | default('/mnt/pgdata', true) }}"
    monitor_ip: "{{ lookup('env', 'MONITOR_IP') }}"

    # No-IP / TLS / monitor values.
    noip_username: "{{ lookup('env', 'NOIP_USERNAME') }}"
    noip_password: "{{ lookup('env', 'NOIP_PASSWORD') }}"
    noip_hostnames: "{{ lookup('env', 'NOIP_HOSTNAMES') }}"
    certbot_email: "{{ lookup('env', 'CERTBOT_EMAIL') }}"
    monitor_pub_key: "{{ lookup('env', 'MONITOR_PUB_KEY') | default('ssh-rsa  august@august-laptop') }}"

    # Resource limits
    postgres_cpu_limit: "{{ lookup('env', 'POSTGRES_CPU_LIMIT') | default('0.2', true) }}"
    postgres_mem_limit: "{{ lookup('env', 'POSTGRES_MEM_LIMIT') | default('300M', true) }}"
    app_replicas: "{{ lookup('env', 'APP_REPLICAS') | default('2', true) }}"
    app_cpu_limit: "{{ lookup('env', 'APP_CPU_LIMIT') | default('0.2', true) }}"
    app_mem_limit: "{{ lookup('env', 'APP_MEM_LIMIT') | default('256M', true) }}"

    jwt_key: "{{ lookup('env', 'JWT_KEY')  }}"

    nginx_site_dest: /etc/nginx/sites-available/minitwit.conf
    nginx_site_enabled: /etc/nginx/sites-enabled/minitwit.conf

    volume_device: /dev/sda
    compose_file: docker-compose.yml
    compose_src: ../docker-compose.yml
    compose_dest: /vagrant/docker-compose.processed.yml
    stack_name: minitwit
    noip_image: ghcr.io/noipcom/noip-duc:3.3.0
    noip_container: noip-duc
    noip_env_file: /vagrant/.env
    monitor_state_dir: /vagrant/monitor

  pre_tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - postgres_user | length > 0
          - postgres_password | length > 0
          - postgres_db | length > 0
          - postgres_host | length > 0
          - monitor_ip | length > 0
          - monitor_pub_key | length > 0
          - jwt_key | length > 0
        fail_msg: >-
          One or more required variables are missing. Required:
          POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, POSTGRES_HOST,
          MONITOR_IP, MONITOR_PUB_KEY, JWT_KEY.

    - name: Select architecture-specific image
      ansible.builtin.set_fact:
        image_name: "{{ 'minitwitutmimage' if ansible_architecture in ['aarch64', 'arm64'] else 'minitwitimage' }}"

    - name: Set Docker image name
      ansible.builtin.set_fact:
        docker_image: "{{ docker_username }}/{{ image_name }}"

  tasks:
    - name: Ensure root SSH directory exists
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Check for monitor private key in /tmp
      ansible.builtin.stat:
        path: /tmp/id_monitor
      register: tmp_monitor_key

    - name: Check for monitor private key in /root
      ansible.builtin.stat:
        path: /root/.ssh/id_monitor
      register: root_monitor_key

    - name: Copy monitor private key from /tmp when needed
      ansible.builtin.copy:
        src: /tmp/id_monitor
        dest: /root/.ssh/id_monitor
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      when:
        - tmp_monitor_key.stat.exists
        - not root_monitor_key.stat.exists

    - name: Verify monitor private key exists
      ansible.builtin.stat:
        path: /root/.ssh/id_monitor
      register: monitor_key

    - name: Fail when monitor private key is missing
      ansible.builtin.fail:
        msg: private ssh key not copied or included; copy it to /tmp/id_monitor or /root/.ssh/id_monitor before running again
      when: not monitor_key.stat.exists

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - gettext-base
        state: present
        update_cache: true

    - name: Ensure apt keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure Docker apt repository
      ansible.builtin.shell: |
        set -euo pipefail
        if [ ! -f /etc/apt/keyrings/docker.gpg ]; then
          curl -fsSL "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg" \
            | gpg --batch --no-tty --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
        fi

        CODENAME="{{ ansible_distribution_release }}"
        if [ "$CODENAME" = "bookworm" ]; then
          CODENAME="bullseye"
        fi

        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/{{ ansible_distribution | lower }} $CODENAME stable" \
          > /etc/apt/sources.list.d/docker.list
      args:
        executable: /bin/bash
        creates: /etc/apt/sources.list.d/docker.list
      register: docker_repo

    - name: Refresh apt cache after Docker repository setup
      ansible.builtin.apt:
        update_cache: true
      when: docker_repo.changed

    - name: Install Docker, Compose plugin, and pgloader
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
          - pgloader
        state: present

    - name: Check installed Docker plugins
      ansible.builtin.command: docker plugin ls --format '{{ "{{.Name}}" }}'
      register: docker_plugins
      changed_when: false

    - name: Install Loki Docker logging plugin
      ansible.builtin.command:
        argv:
          - docker
          - plugin
          - install
          - grafana/loki-docker-driver:latest
          - --alias
          - loki
          - --grant-all-permissions
      register: loki_install
      failed_when: false
      changed_when: loki_install.rc == 0
      when: "'loki' not in docker_plugins.stdout_lines"

    - name: Inspect Loki plugin
      ansible.builtin.command:
        argv:
          - docker
          - plugin
          - inspect
          - loki
      register: loki_inspect
      failed_when: false
      changed_when: false

    - name: Enable Loki plugin when present
      ansible.builtin.command:
        argv:
          - docker
          - plugin
          - enable
          - loki
      register: loki_enable
      failed_when: false
      changed_when: loki_enable.rc == 0
      when: loki_inspect.rc == 0

    - name: Authorize monitor public SSH key for root
      ansible.builtin.lineinfile:
        path: /root/.ssh/authorized_keys
        line: "{{ monitor_pub_key }}"
        create: true
        owner: root
        group: root
        mode: "0600"

    - name: Check Docker Swarm state
      ansible.builtin.command:
        argv:
          - docker
          - info
          - --format
          - '{{ "{{json .Swarm}}" }}'
      register: swarm_info_raw
      changed_when: false

    - name: Parse Docker Swarm state
      ansible.builtin.set_fact:
        swarm_info: "{{ swarm_info_raw.stdout | from_json }}"
        swarm_ip: "{{ ansible_default_ipv4.address | default(ansible_all_ipv4_addresses[0]) }}"

    - name: Leave worker swarm before reinitializing as manager
      ansible.builtin.command:
        argv:
          - docker
          - swarm
          - leave
          - --force
      when:
        - swarm_info.LocalNodeState == 'active'
        - not swarm_info.ControlAvailable

    - name: Initialize Docker Swarm manager
      ansible.builtin.command:
        argv:
          - docker
          - swarm
          - init
          - --advertise-addr
          - "{{ swarm_ip }}"
      when: swarm_info.LocalNodeState != 'active' or not swarm_info.ControlAvailable

    - name: Get manager node IDs
      ansible.builtin.command: docker node ls --format '{{ "{{.ID}}" }}' --filter role=manager
      register: manager_node_ids
      changed_when: false

    # OBS Does not check if label already exists -> Change to using community.docker?
    # https://docs.ansible.com/projects/ansible/latest/collections/community/docker/docker_swarm_module.html
    - name: Label manager node as app
      ansible.builtin.command:
        argv:
          - docker
          - node
          - update
          - --label-add
          - role=app
          - "{{ manager_node_ids.stdout_lines[0] }}"
      when: manager_node_ids.stdout_lines | length > 0

    - name: Check saved monitor node ID
      ansible.builtin.stat:
        path: "{{ monitor_state_dir }}/monitor_node_id"
      register: monitor_node_id_file

    - name: Check saved monitor public IP
      ansible.builtin.stat:
        path: "{{ monitor_state_dir }}/monitor_pub_ip"
      register: monitor_pub_ip_file

    - name: Load saved monitor state
      ansible.builtin.slurp:
        path: "{{ item.path }}"
      register: saved_monitor_files
      loop:
        - name: monitor_node_id
          path: "{{ monitor_state_dir }}/monitor_node_id"
        - name: monitor_pub_ip
          path: "{{ monitor_state_dir }}/monitor_pub_ip"
      when:
        - monitor_node_id_file.stat.exists
        - monitor_pub_ip_file.stat.exists

    - name: Set saved monitor facts
      ansible.builtin.set_fact:
        monitor_node_id: "{{ saved_monitor_files.results[0].content | b64decode | trim }}"
        monitor_pub_ip: "{{ saved_monitor_files.results[1].content | b64decode | trim }}"
      when:
        - monitor_node_id_file.stat.exists
        - monitor_pub_ip_file.stat.exists

    - name: Get Docker Swarm worker join token
      ansible.builtin.command: docker swarm join-token -q worker
      register: worker_join_token
      changed_when: false
      when: monitor_node_id is not defined or monitor_node_id | length == 0

    - name: Run monitor setup through SSH when no saved monitor state exists
      ansible.builtin.shell: |
        set -euo pipefail
        eval "$(ssh-agent -s)"
        ssh-add /root/.ssh/id_monitor
        ssh -o StrictHostKeyChecking=accept-new root@"{{ monitor_ip }}" \
          "SWARM_WORKER_TOKEN={{ worker_join_token.stdout }} SWARM_MANAGER_IP={{ swarm_ip }} bash -s" \
          < /vagrant/monitor_setup.sh
      args:
        executable: /bin/bash
        # creates: "{{ monitor_state_dir }}/monitor_node_id" # Does this make it idempotent?
      register: monitor_setup_result
      when: monitor_node_id is not defined or monitor_node_id | length == 0

    - name: Parse monitor setup result
      ansible.builtin.set_fact:
        monitor_node_id: "{{ monitor_setup_result.stdout.split('\n')[1].split()[0] }}"
        monitor_pub_ip: "{{ monitor_setup_result.stdout.split('\n')[1].split()[1] }}"
      when:
        - monitor_setup_result is defined
        - monitor_setup_result.stdout is defined
        - monitor_setup_result.stdout.split() | length >= 2

    - name: Ensure monitor state directory exists
      ansible.builtin.file:
        path: "{{ monitor_state_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: monitor_node_id is defined and monitor_node_id | length > 0

    - name: Save monitor node ID
      ansible.builtin.copy:
        content: "{{ monitor_node_id }}\n"
        dest: "{{ monitor_state_dir }}/monitor_node_id"
        owner: root
        group: root
        mode: "0644"
      when: monitor_node_id is defined and monitor_node_id | length > 0

    - name: Save monitor public IP
      ansible.builtin.copy:
        content: "{{ monitor_pub_ip }}\n"
        dest: "{{ monitor_state_dir }}/monitor_pub_ip"
        owner: root
        group: root
        mode: "0644"
      when: monitor_pub_ip is defined and monitor_pub_ip | length > 0

    - name: Label monitor node
      ansible.builtin.command:
        argv:
          - docker
          - node
          - update
          - --label-add
          - role=monitoring
          - "{{ monitor_node_id }}"
      when: monitor_node_id is defined and monitor_node_id | length > 0

    - name: Ensure /vagrant exists
      ansible.builtin.file:
        path: /vagrant
        state: directory
        mode: "0755"

    - name: Check compose file in /vagrant
      ansible.builtin.stat:
        path: "/vagrant/{{ compose_file }}"
      register: vagrant_compose

    - name: Check compose file in /tmp
      ansible.builtin.stat:
        path: "/tmp/{{ compose_file }}"
      register: tmp_compose

    - name: Fail when compose file is missing
      ansible.builtin.fail:
        msg: "Could not find {{ compose_file }} in /vagrant or /tmp"
      when:
        - not vagrant_compose.stat.exists
        - not tmp_compose.stat.exists

    - name: Copy compose file from target staging path
      ansible.builtin.copy:
        src: "{{ '/vagrant/' ~ compose_file if vagrant_compose.stat.exists else '/tmp/' ~ compose_file }}"
        dest: "/vagrant/{{ compose_file }}"
        remote_src: true
        mode: "0644"

    - name: Check if PostgreSQL volume device exists
      ansible.builtin.stat:
        path: "{{ volume_device }}"
      register: pg_volume_device

    # PostgreSQL
    - name: Setup PostgreSQL volume
      when: pg_volume_device.stat.exists and pg_volume_device.stat.isblk
      block:
        - name: Ensure mount directory exists
          ansible.builtin.file:
            path: "{{ volume_mount }}"
            state: directory
            mode: "0755"

        - name: Mount and persist volume
          ansible.builtin.mount:
            path: "{{ volume_mount }}"
            src: "{{ volume_device }}"
            fstype: ext4
            opts: defaults,nofail
            state: mounted

        - name: Set ownership for PostgreSQL
          ansible.builtin.file:
            path: "{{ volume_mount }}"
            owner: "999"
            group: "999"
            recurse: true

        - name: Create bind-backed Docker volume for PostgreSQL
          community.docker.docker_volume:
            name: postgres_data
            driver: local
            driver_options:
              type: none
              device: "{{ volume_mount }}"
              o: bind

    # Installs for TLS
    - name: install Nginx + firewall + certbot
      apt:
        name:
          - nginx
          - ufw
          - certbot
          - python3-certbot-nginx
        state: present
        update_cache: yes

    # Start Nginx
    - name: Ensure nginx is running
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true

    # Firewall (UFW)
    - name: Allow SSH
      community.general.ufw:
        rule: allow
        name: OpenSSH

    - name: Allow HTTPS via nginx
      community.general.ufw:
        rule: allow
        name: "Nginx Full"

    - name: Enable UFW
      community.general.ufw:
        state: enabled

    # Nginx configuration
    - name: Deploy nginx site config
      ansible.builtin.copy:
        src: "../nginx/sites-available/minitwit.conf"
        dest: "{{ nginx_site_dest }}"
        owner: root
        group: root
        mode: "0644"
      notify: restart nginx

    - name: Enable nginx site
      ansible.builtin.file:
        src: "{{ nginx_site_dest }}"
        dest: "{{ nginx_site_enabled }}"
        state: link
        force: true
      notify: restart nginx

    - name: Disable default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: restart nginx

    # No-IP container
    - name: Run No-IP dynamic DNS container
      community.docker.docker_container:
        name: noip-duc
        image: ghcr.io/noipcom/noip-duc:latest
        env_file: "{{ noip_env_file }}"
        restart_policy: unless-stopped
        state: started
      when:
        - noip_username | default('') | length > 0
        - noip_password | default('') | length > 0
        - noip_hostnames | default('') | length > 0

    # Certbot
    - name: Obtain or renew TLS certificate
      ansible.builtin.command: >
        certbot --nginx --non-interactive
        --agree-tos
        --email {{ certbot_email }}
        --keep-until-expiring
        --redirect
        -d {{ noip_hostnames }}
      when:
        - certbot_email | default('') | length > 0
        - noip_hostnames | default('') | length > 0

    # Render Docker Compose file
    - name: Render Docker Compose from template
      ansible.builtin.shell: |
        envsubst < /vagrant/{{ compose_file }} > /vagrant/docker-compose.processed.yml
      args:
        executable: /bin/bash
      environment:
        POSTGRES_USER: "{{ postgres_user }}"
        POSTGRES_PASSWORD: "{{ postgres_password }}"
        POSTGRES_DB: "{{ postgres_db }}"
        POSTGRES_HOST: "{{ postgres_host }}"
        POSTGRES_PORT: "{{ postgres_port }}"
        DB_SSL_MODE: "{{ db_ssl_mode }}"
        JWT_KEY: "{{ jwt_key }}"
        DOCKER_USERNAME: "{{ docker_username }}"
        APP_REPLICAS: "{{ app_replicas }}"
        MONITOR_PUB_IP: "{{ monitor_pub_ip }}"

    # Fix image name (if needed)
    - name: Ensure correct image is used
      ansible.builtin.replace:
        path: "{{ compose_dest }}"
        regexp: "minitwitimage:latest"
        replace: "{{ image_name }}:latest"

    # Check Loki plugin
    - name: Check if Loki plugin is enabled
      ansible.builtin.command: docker plugin inspect loki --format '{{ "{{.Enabled}}" }}'
      register: loki_enabled
      failed_when: false
      changed_when: false

    # Remove logging block if Loki missing
    - name: Remove Loki logging config if unavailable
      ansible.builtin.replace:
        path: "{{ compose_dest }}"
        regexp: '(?ms)minitwit:.*?logging:.*?(?=\n\s{2}[a-zA-Z0-9_-]+:)'
        replace: '\g<0>'
      when: loki_enabled.stdout != "true"

    # Pull required images
    - name: Pull application image
      community.docker.docker_image:
        name: "{{ docker_image }}"
        source: pull

    - name: Pull PostgreSQL image (initial deployment)
      community.docker.docker_image:
        name: postgres:15-alpine
        source: pull

    # Deploy stack
    - name: Deploy Docker Swarm stack
      ansible.builtin.command: >
        docker stack deploy
        --compose-file {{ compose_dest }}
        --with-registry-auth
        --prune
        {{ stack_name }}

    # Lil' pause for things to do their thang
    - name: Wait for services to settle
      ansible.builtin.pause:
        seconds: 10

    # Show status
    - name: Show stack services
      ansible.builtin.command: docker stack services {{ stack_name }}
      changed_when: false

    - name: Show stack tasks
      ansible.builtin.command: docker stack ps {{ stack_name }}
      changed_when: false

    - name: Print deployment summary
      ansible.builtin.debug:
        msg:
          - "Minitwit running at https://{{ swarm_ip }}:8080"
          - "Prometheus: https://{{ monitor_pub_ip | default('UNKNOWN') }}:9090"
          - "Grafana: https://{{ monitor_pub_ip | default('UNKNOWN') }}:3000"
          - "Loki: https://{{ monitor_pub_ip | default('UNKNOWN') }}:3100"

  handlers:
    - name: restart nginx
      service:
        name: nginx
        state: restarted
